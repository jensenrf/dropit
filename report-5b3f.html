<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>drop_it daily report</title>
<style>
  :root{--bg:#0b1020;--panel:#141a3d;--line:rgba(159,176,255,.22);--ink:#fff;--mute:#8d97d6;--dim:#6671b5;--gold:#ffe066;--mint:#5ef2c2;--red:#ff6b6b;--blue:#7f8cff}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
  .brand{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700;text-align:center}
  h1{margin:6px 0 2px;text-align:center;font-size:26px;font-weight:800}
  .sub{text-align:center;color:var(--dim);font-size:12px;font-weight:600;min-height:18px}
  .badge{display:inline-block;background:var(--gold);color:#1b1400;border-radius:999px;font-size:11px;font-weight:800;padding:2px 8px;margin-left:8px;vertical-align:middle}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center}
  .card .v{font-size:30px;font-weight:800;line-height:1.1}
  .card .k{margin-top:4px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:700}
  .meta{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;color:var(--mute);font-size:13px;margin:6px 0 18px}
  .meta b{color:var(--ink)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 8px 12px}
  .panel h2{margin:0 0 10px;text-align:center;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700}
  .row{display:flex;align-items:stretch;gap:6px}
  .nav{flex:0 0 44px;border:1px solid var(--line);background:#1d2552;color:#fff;border-radius:12px;font-size:22px;font-weight:800;cursor:pointer;align-self:center;height:96px}
  .nav:disabled{opacity:.25;cursor:default}
  .nav:not(:disabled):active{background:#2a3270}
  .chart{flex:1;min-width:0;height:220px;display:flex;align-items:flex-end;gap:3px;padding:0 2px;border-bottom:2px solid var(--line);position:relative}
  .col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
  .bar{width:100%;background:linear-gradient(#ffe066,#f0a030);border-radius:5px 5px 0 0;min-height:0}
  .bar.zero{background:none}
  .cnt{font-size:11px;font-weight:800;margin-bottom:3px;color:var(--ink);height:14px;line-height:14px}
  .lvl{position:absolute;bottom:-22px;font-size:11px;color:var(--mute);font-weight:700}
  .empty,.err,.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mute);font-weight:700;padding:0 10px}
  .err{color:var(--red)}
  .axis{text-align:center;color:var(--dim);font-size:11px;margin-top:30px;font-weight:600}
  .foot{margin-top:16px;text-align:center;color:var(--dim);font-size:12px}
  button.link{background:none;border:none;color:var(--blue);font:inherit;font-weight:700;cursor:pointer;padding:4px 8px}
</style>
</head>
<body>
<main>
  <div class="brand">drop_it &middot; daily report</div>
  <h1 id="dayLabel">Loading&hellip;</h1>
  <div class="sub" id="daySub">&nbsp;</div>

  <div class="cards">
    <div class="card"><div class="v" id="vRuns">-</div><div class="k">Completed games</div></div>
    <div class="card"><div class="v" id="vLevel">-</div><div class="k">Avg level</div></div>
    <div class="card"><div class="v" id="vScore">-</div><div class="k">Avg score</div></div>
  </div>
  <div class="meta" id="meta"></div>

  <div class="panel">
    <h2>Level reached, by run</h2>
    <div class="row">
      <button class="nav" id="prev" aria-label="Previous day" disabled>&#9664;</button>
      <div class="chart" id="chart"><div class="loading">Loading&hellip;</div></div>
      <button class="nav" id="next" aria-label="Next day" disabled>&#9654;</button>
    </div>
    <div class="axis" id="axis">level reached when the run ended</div>
  </div>

  <div class="foot">
    Finished games only (runs abandoned mid-way aren't counted). Only the last 30 days are kept.<br>
    <span id="updated"></span> <button class="link" id="refresh">Refresh</button>
  </div>
</main>

<script>
(() => {
  'use strict';
  const API = 'https://jlgmqbnokpyyhraakvce.supabase.co/rest/v1/rpc/daily_report';
  const KEY = 'sb_publishable_ixrxWk3_fPpmIbjKDquZrQ_q_ZszcDq';   // public, read-only aggregates
  const $ = id => document.getElementById(id);
  let data = null, token = 0;

  const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const nice = iso => new Intl.DateTimeFormat('en-US', { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'UTC' }).format(new Date(iso + 'T00:00:00Z'));
  const fmt = n => (n === null || n === undefined) ? '-' : Number(n).toLocaleString('en-US');

  async function load(day) {
    const my = ++token;
    $('prev').disabled = $('next').disabled = true;
    try {
      const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), 9000);
      const r = await fetch(API, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_day: day || null }), signal: ctrl.signal });
      clearTimeout(to);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if (my !== token) return;
      data = j; render();
    } catch (e) {
      if (my !== token) return;
      $('chart').innerHTML = '<div class="err">Could not load this day.<br>Check your connection and tap Refresh.</div>';
      if (data) { $('prev').disabled = data.day <= data.oldest; $('next').disabled = data.day >= data.today; }
    }
  }

  function render() {
    const d = data, isToday = d.day === d.today;
    $('dayLabel').innerHTML = nice(d.day) + (isToday ? '<span class="badge">TODAY</span>' : '');
    $('daySub').textContent = 'Arizona time' + (isToday ? ' · updates as games finish' : '');
    $('vRuns').textContent = fmt(d.runs);
    $('vLevel').textContent = d.runs ? Number(d.avg_level).toFixed(1) : '-';
    $('vScore').textContent = d.runs ? fmt(d.avg_score) : '-';

    if (d.runs) {
      const c = d.causes, pct = n => Math.round(100 * n / d.runs) + '%';
      $('meta').innerHTML = `<span>Top score <b>${fmt(d.top_score)}</b></span>` +
        `<span>Ended by: bomb <b>${pct(c.bomb)}</b> &middot; clamp <b>${pct(c.clamp)}</b> &middot; level failed <b>${pct(c.failed)}</b></span>`;
    } else $('meta').innerHTML = '';

    drawChart(d);
    $('prev').disabled = d.day <= d.oldest;
    $('next').disabled = d.day >= d.today;
    $('updated').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  function drawChart(d) {
    const chart = $('chart');
    if (!d.runs) { chart.innerHTML = '<div class="empty">No finished games on this day.</div>'; return; }
    const counts = new Map(d.hist.map(h => [h.level, h.count]));
    const maxLevel = Math.max(8, ...d.hist.map(h => h.level));
    const maxCount = Math.max(...d.hist.map(h => h.count));
    const showEvery = maxLevel <= 14 ? 1 : 5;
    let html = '';
    for (let lv = 1; lv <= maxLevel; lv++) {
      const n = counts.get(lv) || 0;
      const h = n ? Math.max(3, Math.round(176 * n / maxCount)) : 0;
      const label = (lv === 1 || lv % showEvery === 0 || lv === maxLevel) ? lv : '';
      html += `<div class="col" data-level="${lv}" data-count="${n}"><div class="cnt">${n || ''}</div><div class="bar${n ? '' : ' zero'}" style="height:${h}px"></div><div class="lvl">${label}</div></div>`;
    }
    chart.innerHTML = html;
  }

  $('prev').onclick = () => { if (data && data.day > data.oldest) load(addDays(data.day, -1)); };
  $('next').onclick = () => { if (data && data.day < data.today) load(addDays(data.day, 1)); };
  $('refresh').onclick = () => load(data ? data.day : null);
  addEventListener('keydown', e => { if (e.key === 'ArrowLeft') $('prev').click(); else if (e.key === 'ArrowRight') $('next').click(); });
  load(null);
})();
</script>
</body>
</html>

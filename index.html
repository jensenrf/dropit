<script>
(() => {
'use strict';

/* ============================================================
   TUNABLES  (everything you'd want to tweak while playtesting)
   ============================================================ */
const CFG = {
  // --- run structure ---
  barsPerLevel: 10,         // real bars per level (fake-outs and bombs don't count)
  passMin: 6,               // catch at least this many to clear a level
  hpMax: 3,                 // clamp health. +1 back after each cleared level
  // --- layout ---
  handY: 500, groundY: 700, railY: 106, hangGap: 140, barW: 34,
  // --- difficulty: d = (level - 1) + barIndex / barsPerLevel ---
  hMax: 200, hMin: 150, hPerD: 5,          // bar length shrinks with d
  gBase: 800, gPerD: 90, gMax: 1700,       // gravity (px/s^2) grows with d
  rampLevels: 8,                           // timing reaches its floor at this d
  waitStart: [0.6, 1.5], waitEnd: [0.15, 0.45],   // pause before the rattle (s)
  tellStart: [0.45, 0.85], tellEnd: [0.15, 0.30], // rattle length before release (s)
  enterTime: 0.55, exitTime: 0.5,
  // --- fake-outs ---
  decoyChance: 0.15, decoyPerD: 0.02, decoyMax: 0.35,   // chance a fake-out precedes a bar
  dipMin: 11, dipMax: 44,                  // how far a fake-out bar visibly drops (px), L1 -> L4+
  fakePenalty: 25,                         // points lost (and combo reset) for tapping a non-bar
  // --- moving target: max offset from center, by level (fraction of half-length) ---
  targetOffMax: [0, 0.25, 0.5, 0.7],
  // --- hazards: sections of the bar. They are always kept off the target itself. ---
  spikeFrom: 3, spikeChance: 0.5,          // spiked section: costs 1 clamp health
  bombFrom: 4, bombChance: 0.35,           // planted bomb: catch it and the clamp blows up, run over
  // --- scoring ---
  comboStep: 0.5,
  tiers: [                  // f = distance from target, 0 (dead on) .. 1 (half a bar away)
    { name: 'PERFECT', f: 0.20, mult: 10, color: '#ffe066' },
    { name: 'GREAT',   f: 0.45, mult: 5,  color: '#5ef2c2' },
    { name: 'GOOD',    f: 0.75, mult: 2,  color: '#6cb8ff' },
    { name: 'EDGE',    f: 1.01, mult: 1,  color: '#c3c9dd' },
  ],
};
const LEVEL_INFO = {
  1: ['CATCH THE BAR', 'Aim for the glowing middle'],
  2: ['NEW: MOVING TARGET', 'Aim for the glowing zone'],
  3: ['NEW: SPIKES', 'Spikes damage your clamp'],
  4: ['NEW: BOMBS', 'Catch a bomb and the clamp blows up'],
  5: ['SPEED UP', 'Everything gets faster from here'],
};

/* ============================================================
   SETUP
   ============================================================ */
const W = 420, H = 760;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * scale + 'px';
  cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
}
addEventListener('resize', resize); resize();

const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
/* ---------- seeded randomness for the daily deck ---------- */
function hashStr(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^ (h >>> 16)) >>> 0;
}
function seededRng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function loadNum(k) { try { return +localStorage.getItem(k) || 0; } catch (e) { return 0; } }
function saveNum(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }
function loadStr(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }

function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------- audio (tiny synth, no assets) ---------- */
let AC = null;
function audio() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
  return AC;
}
function tone(f, d = 0.12, type = 'sine', vol = 0.12, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + d + 0.03);
}
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

/* ============================================================
   GAME STATE
   ============================================================ */
// S: 'title' | 'banner' | 'hang' | 'fall' | 'settle' | 'results' | 'entry' | 'board'
// While S === 'hang' the item has a phase: enter | wait | shake | hitch | hold | exit
let S = 'title';
let bar = null, idx = 0, timer = 0, lastSpecial = false;
let level = 1, hp = CFG.hpMax, lost = 0, dead = null, banner = null, hpHit = 0;
let score = 0, shownScore = 0, caught = 0, fakes = 0, streak = 0, maxStreak = 0, accSum = 0;
let tierCounts = [0, 0, 0, 0];
let log = [];                 // this level: tier index, -1 miss, -2 spiked
let best = loadNum('dropit_best'), bestLevel = loadNum('dropit_best_level'), newBest = false;
let particles = [], texts = [];
let handGap = 66, handHold = 0, handClosedGap = 7;
let shake = 0, flash = 0, flashColor = '#fff';
let resLock = 0, lastFrame = performance.now();
let toast = null;
const dbg = { next: null };
const shareBtn = { x: 40, y: 530, w: 165, h: 50 };
const boardBtn = { x: 215, y: 530, w: 165, h: 50 };
const titleBoardBtn = { x: 110, y: 676, w: 200, h: 42 };
const enterBtn = { x: 110, y: 500, w: 200, h: 56 };
const skipBtn = { x: 150, y: 574, w: 120, h: 36 };
const copyBtn = { x: 110, y: 618, w: 200, h: 42 };

/* ---------- daily leaderboard (Supabase). "Day" = calendar day in Arizona time. ---------- */
const LB = {
  url: 'https://jlgmqbnokpyyhraakvce.supabase.co',
  key: 'sb_publishable_ixrxWk3_fPpmIbjKDquZrQ_q_ZszcDq',   // public, read/submit-only by design
  tz: 'America/Phoenix',
  size: 10,
};
const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
let board = { status: 'idle', rows: [], day: '' };   // status: idle | loading | ok | error
let entry = null, runId = 0, lbNote = '', highlight = 0, boardFrom = 'title', boardLock = 0;
let lastInitials = (loadStr('dropit_initials') || 'AAA').toUpperCase().replace(/[^A-Z0-9]/g, 'A').padEnd(3, 'A').slice(0, 3);

/* ---------- the daily deck ----------
   Each level has a "deck" of cards (target position, hazards, timing). The deck's CONTENT is
   seeded by today's date, so every player gets the same cards. The ORDER is shuffled fresh on
   every run with real randomness, so nothing can be memorized or predicted. */
let plan = [], planPos = 0;

function dayKey() {
  if (dbg.day) return dbg.day;
  try { return new Intl.DateTimeFormat('en-CA', { timeZone: LB.tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
  catch (e) { return new Date().toISOString().slice(0, 10); }
}

function makeSegs(off, rnd, spikes, bomb) {
  // Segments are fractions along the bar, 0 = top .. 1 = bottom. Always kept off the target.
  const segs = [];
  const uT = 0.5 + off * 0.5, avoid = [uT - 0.13, uT + 0.13];
  const rr2 = (a, b) => a + rnd() * (b - a);
  const place = (type, len) => {
    for (let n = 0; n < 14; n++) {
      const a = rr2(0.04, 0.96 - len), b = a + len;
      if (b > avoid[0] && a < avoid[1]) continue;
      if (segs.some(sg => b > sg.a - 0.04 && a < sg.b + 0.04)) continue;
      segs.push({ type, a, b }); return;
    }
  };
  if (spikes >= 1) place('spike', rr2(0.14, 0.2));
  if (spikes >= 2) place('spike', rr2(0.12, 0.16));
  if (bomb) place('bomb', 0.2);
  return segs;
}

function buildCards(lv) {
  const rnd = seededRng(hashStr(dayKey() + ':L' + lv));
  const N = CFG.barsPerLevel;
  const mo = CFG.targetOffMax[Math.min(lv - 1, CFG.targetOffMax.length - 1)];
  const pd = Math.min(CFG.decoyMax, CFG.decoyChance + CFG.decoyPerD * (lv - 1 + 0.5));
  const nDecoy = Math.max(0, Math.min(4, Math.round(N * pd + (rnd() - 0.5))));
  const total = N + nDecoy;
  const count = (chance, from) => lv >= from ? Math.max(0, Math.min(N, Math.round(N * chance + (rnd() - 0.5) * 2))) : 0;
  const pickIdx = n => shuffled([...Array(N).keys()], rnd).slice(0, n);
  const spikeIdx = new Set(pickIdx(count(CFG.spikeChance, CFG.spikeFrom)));
  const spike2Idx = new Set(lv >= 6 ? pickIdx(Math.round(N * 0.3)) : []);
  const bombIdx = new Set(pickIdx(count(CFG.bombChance, CFG.bombFrom)));
  // stratified values: one per slice of the range, so every deck covers easy AND hard cases evenly
  const strat = () => shuffled([...Array(N).keys()].map(k => (k + rnd()) / N), rnd);
  const offU = strat(), waitU = strat(), tellU = strat();
  const cards = [];
  for (let k = 0; k < total; k++) {
    const real = k < N;
    const off = mo ? mo * (2 * (real ? offU[k] : rnd()) - 1) : 0;
    const spikes = real ? (spikeIdx.has(k) ? 1 : 0) + (spike2Idx.has(k) ? 1 : 0)
                        : (lv >= CFG.spikeFrom && rnd() < CFG.spikeChance ? 1 : 0);
    const bomb = real ? bombIdx.has(k) : (lv >= CFG.bombFrom && rnd() < CFG.bombChance);
    cards.push({ off, segs: makeSegs(off, rnd, spikes, bomb), uw: real ? waitU[k] : rnd(), ut: real ? tellU[k] : rnd() });
  }
  return { cards, nDecoy };
}

function buildPlan(lv) {
  const { cards, nDecoy } = buildCards(lv);
  const N = CFG.barsPerLevel;
  const bars = shuffled(cards.slice(0, N), Math.random).map(c => ({ kind: 'bar', card: c }));
  const decoys = cards.slice(N, N + nDecoy).map(c => ({ kind: 'decoy', card: c }));
  const minIdx = lv === 1 ? 3 : 1;                       // no fake-outs right at the start
  const gaps = shuffled(Array.from({ length: N - minIdx }, (_, i) => minIdx + i), Math.random).slice(0, decoys.length);
  const out = []; let d = 0;
  for (let i = 0; i < N; i++) { if (gaps.includes(i) && d < decoys.length) out.push(decoys[d++]); out.push(bars[i]); }
  return out;
}

function newBar(i, kind, ov) {
  ov = ov || {};
  const d = (level - 1) + i / CFG.barsPerLevel;
  const t = Math.min(1, d / CFG.rampLevels);
  const h = Math.max(CFG.hMin, CFG.hMax - CFG.hPerD * d);
  const w0 = lerp(CFG.waitStart[0], CFG.waitEnd[0], t), w1 = lerp(CFG.waitStart[1], CFG.waitEnd[1], t);
  const k0 = lerp(CFG.tellStart[0], CFG.tellEnd[0], t), k1 = lerp(CFG.tellStart[1], CFG.tellEnd[1], t);
  const top0 = CFG.handY - CFG.hangGap - h;
  const mo = CFG.targetOffMax[Math.min(level - 1, CFG.targetOffMax.length - 1)];
  const off = ov.off !== undefined ? ov.off : (mo ? rand(-mo, mo) : 0);
  const segs = ov.segs || makeSegs(off, Math.random,
    level >= CFG.spikeFrom && Math.random() < CFG.spikeChance ? 1 : 0, level >= CFG.bombFrom && Math.random() < CFG.bombChance);
  bar = {
    i, h, kind, g: Math.min(CFG.gMax, CFG.gBase + CFG.gPerD * d),
    off, segs,
    top: top0, top0, vy: 0, cx: -60, x: -60, ox: 0, oy: 0, dip: 0, cdip: 0, jaw: CFG.barW / 2,
    phase: 'enter', pt: 0, rattle: 0,
    wait: (ov.uw !== undefined ? lerp(w0, w1, ov.uw) : rand(w0, w1)) * (kind === 'decoy' ? 0.8 : 1),
    tell: ov.ut !== undefined ? lerp(k0, k1, ov.ut) : rand(k0, k1),
    released: false, exitT: 0, penalized: false, clanked: false, hidden: false,
    free: false, caught: false, landed: false, tier: -1, f: 1,
  };
  timer = 0;
}

function spawn() {
  let kind = 'bar', o;
  const ov = dbg.next; dbg.next = null;
  if (ov && ov.kind) { kind = ov.kind; o = ov; }           // test hook: force a specific item
  else {
    const item = plan[planPos++];
    if (item) { kind = item.kind; o = { off: item.card.off, segs: item.card.segs, uw: item.card.uw, ut: item.card.ut }; }
  }
  lastSpecial = kind !== 'bar';
  newBar(idx, kind, o);
  S = 'hang';
}

function startBanner(lv, cleared) {
  banner = { lv, cleared, t: 0 };
  bar = null; S = 'banner'; texts = [];
}
function beginLevel() {
  level = banner.lv; idx = 0; lost = 0; log = []; lastSpecial = false;
  banner = null; plan = buildPlan(level); planPos = 0; spawn();
}
function startRun() {
  score = shownScore = caught = fakes = streak = maxStreak = 0;
  accSum = 0; tierCounts = [0, 0, 0, 0]; newBest = false; dead = null;
  particles = []; texts = []; handHold = 0; hp = CFG.hpMax; hpHit = 0; level = 1;
  runId++; entry = null; lbNote = ''; highlight = 0;
  startBanner(1, false);
}

/* ============================================================
   RULES
   ============================================================ */
function addText(x, y, text, color, size = 26, life = 0.9) {
  texts.push({ x, y, text, color, size, life, max: life });
}
function burst(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(speed * 0.4, speed);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - speed * 0.3, life: rand(0.35, 0.7), max: 0.7, color, r: rand(2, 4.5) });
  }
}
function whiff() { handHold = 0.18; handClosedGap = 6; }

function lostBar() {
  lost++;
  if (!dead && lost > CFG.barsPerLevel - CFG.passMin) dead = 'LEVEL FAILED';
}

function endBarMiss(label) {
  S = 'settle'; timer = 0;
  streak = 0; log.push(-1); lostBar();
  addText(W / 2, CFG.handY - 70, label, '#ff6b6b', 30, 1.0);
  shake = Math.max(shake, 7);
  tone(150, 0.25, 'sawtooth', 0.09); buzz(60);
}

function openJaws() { bar.released = true; bar.free = true; bar.jaw = CFG.barW / 2 + 16; bar.x = W / 2; bar.ox = 0; bar.oy = 0; bar.dip = 0; bar.cdip = 0; }

function releaseBar() {
  openJaws(); bar.phase = 'fall'; S = 'fall';
  tone(95, 0.12, 'square', 0.1); tone(60, 0.16, 'sawtooth', 0.07, 0.02);
}

function falseStart() {
  if (!bar.released) openJaws();
  whiff();
  endBarMiss('TOO EARLY');
}

function fakePenalty() {
  // Tapped something that isn't a catchable bar: combo gone, points docked.
  bar.penalized = true; fakes++; streak = 0;
  const lost2 = Math.min(score, CFG.fakePenalty); score -= lost2;
  whiff();
  addText(W / 2, CFG.handY - 70, 'FAKE-OUT!', '#ff9f43', 30, 1.0);
  if (lost2) addText(W / 2, CFG.handY - 38, '-' + lost2, '#ff6b6b', 24, 1.0);
  shake = Math.max(shake, 6);
  tone(200, 0.2, 'sawtooth', 0.09); tone(140, 0.2, 'square', 0.07, 0.08); buzz(60);
}

function boom(x, y) {
  burst(x, y, '#ffb347', 46, 520); burst(x, y, '#ff5a3c', 30, 380); burst(x, y, '#ffe066', 18, 260);
  flash = 0.75; flashColor = '#fff'; shake = 16;
  tone(70, 0.5, 'sawtooth', 0.18); tone(45, 0.6, 'square', 0.14, 0.02); buzz(180);
}

function explodeBomb(top) {
  // Caught the bar on its planted bomb: the clamp blows up and the run is over.
  bar.top = top; bar.vy = 0; bar.caught = true; bar.free = false; bar.hidden = true;
  S = 'settle'; timer = 0; streak = 0;
  dead = 'BOMB BLEW UP YOUR CLAMP';
  hp = 0; hpHit = 0.8; log.push(-2);
  handHold = 0.5; handClosedGap = CFG.barW / 2 + 1;
  boom(W / 2, CFG.handY);
  addText(W / 2, CFG.handY - 70, 'BOOM', '#ff5a3c', 44, 1.4);
}

function spikeHit(top) {
  bar.top = top; bar.vy = 0; bar.caught = true; bar.free = false;
  S = 'settle'; timer = 0;
  streak = 0; log.push(-2); lostBar();
  hp = Math.max(0, hp - 1); hpHit = 0.6;
  handHold = 0.5; handClosedGap = CFG.barW / 2 + 1;
  burst(W / 2, CFG.handY, '#ff4d5a', 20, 340);
  flash = 0.4; flashColor = '#ff4d5a'; shake = Math.max(shake, 9);
  tone(130, 0.25, 'sawtooth', 0.12); tone(90, 0.3, 'square', 0.1, 0.05); buzz(90);
  if (hp <= 0) {
    dead = 'CLAMP DESTROYED';
    addText(W / 2, CFG.handY - 70, 'CLAMP DESTROYED', '#ff4d5a', 30, 1.2);
    boom(W / 2, CFG.handY);
  } else {
    addText(W / 2, CFG.handY - 70, 'SPIKED!', '#ff4d5a', 32, 1.0);
    addText(W / 2, CFG.handY - 38, '-1 CLAMP', '#ff9f43', 22, 1.0);
  }
}

function doCatch(top) {
  const u = (CFG.handY - top) / bar.h;                   // where on the bar the hand is, 0 = top .. 1 = bottom
  const seg = bar.segs.find(s => u >= s.a && u <= s.b);
  if (seg && seg.type === 'bomb') { explodeBomb(top); return; }
  if (seg && seg.type === 'spike') { spikeHit(top); return; }

  bar.top = top; bar.vy = 0; bar.caught = true; bar.free = false;
  const tPos = top + (0.5 + bar.off * 0.5) * bar.h;       // y of the target center
  const f = Math.min(1, Math.abs(CFG.handY - tPos) / (bar.h / 2));
  let ti = CFG.tiers.findIndex(t => f <= t.f); if (ti < 0) ti = CFG.tiers.length - 1;
  const tier = CFG.tiers[ti];
  streak++; maxStreak = Math.max(maxStreak, streak);
  const mult = 1 + CFG.comboStep * (streak - 1);
  const pts = Math.round(tier.mult * mult);
  score += pts; caught++; accSum += (1 - f); tierCounts[ti]++; log.push(ti);
  bar.tier = ti; bar.f = f;
  S = 'settle'; timer = 0;
  handHold = 0.5; handClosedGap = CFG.barW / 2 + 1;
  addText(W / 2, CFG.handY - 70, tier.name, tier.color, ti === 0 ? 34 : 28, 0.9);
  addText(W / 2, CFG.handY - 38, '+' + pts, '#fff', 24, 0.9);
  burst(W / 2, CFG.handY, tier.color, [34, 18, 9, 4][ti], [420, 320, 240, 160][ti]);
  if (ti === 0) { flash = 0.28; flashColor = tier.color; shake = Math.max(shake, 6); }
  const base = 520 + Math.min(streak, 12) * 28;
  if (ti === 0) { tone(base, 0.14, 'triangle', 0.14); tone(base * 1.5, 0.2, 'triangle', 0.12, 0.07); }
  else if (ti === 1) { tone(base, 0.14, 'triangle', 0.12); tone(base * 1.25, 0.14, 'triangle', 0.1, 0.06); }
  else tone(base * (ti === 2 ? 0.9 : 0.7), 0.12, 'triangle', 0.1);
  buzz(ti === 0 ? 25 : 12);
}

function tap(ts) {
  if (S === 'hang') {
    if (bar.kind !== 'bar') {                              // fake-out: hands off
      if (bar.phase !== 'exit' && !bar.penalized) fakePenalty();
      return;
    }
    falseStart(); return;
  }
  if (S !== 'fall') return;
  // Advance the item to the exact moment of the input, not the last frame.
  const extra = Math.max(0, Math.min(0.034, ((ts || performance.now()) - lastFrame) / 1000));
  const top = bar.top + bar.vy * extra + 0.5 * bar.g * extra * extra;
  const bottom = top + bar.h;
  if (top > CFG.handY) return;                             // already slipped past
  if (bottom < CFG.handY) { falseStart(); return; }        // not in reach yet
  doCatch(top);
}

function finishRun() {
  S = 'results'; resLock = 0.6;
  if (score > best) { best = score; newBest = true; saveNum('dropit_best', best); }
  if (level > bestLevel) { bestLevel = level; saveNum('dropit_best_level', bestLevel); }
  tone(300, 0.2, 'triangle', 0.1); tone(240, 0.2, 'triangle', 0.1, 0.12); tone(180, 0.4, 'triangle', 0.1, 0.24);
  checkLeaderboard();
}

/* ---------- leaderboard logic ---------- */
async function lbCall(fn, body) {
  const ctrl = new AbortController(), timeout = setTimeout(() => ctrl.abort(), 7000);
  try {
    const r = await fetch(LB.url + '/rest/v1/rpc/' + fn, {
      method: 'POST', headers: { apikey: LB.key, 'Content-Type': 'application/json' },
      body: JSON.stringify(body), signal: ctrl.signal,
    });
    if (!r.ok) { let m = ''; try { m = (await r.json()).message || ''; } catch (e) {} throw new Error(m || 'HTTP ' + r.status); }
    return await r.json();
  } finally { clearTimeout(timeout); }
}
function todayLabel() {
  try { return new Intl.DateTimeFormat('en-US', { timeZone: LB.tz, weekday: 'short', month: 'short', day: 'numeric' }).format(new Date()).toUpperCase(); }
  catch (e) { return ''; }
}
async function loadBoard() {
  board.status = 'loading';
  try {
    const rows = await lbCall('leaderboard_today', { limit_n: LB.size });
    board = { status: 'ok', rows: Array.isArray(rows) ? rows : [], day: todayLabel() };
  } catch (e) { board.status = 'error'; throw e; }
}
function qualifies(sc) { return board.status === 'ok' && sc > 0 && (board.rows.length < LB.size || sc > board.rows[LB.size - 1].score); }
function placeFor(sc) { return board.rows.filter(r => r.score >= sc).length + 1; }

function checkLeaderboard() {
  const id = runId;
  if (score <= 0) { lbNote = ''; return; }
  lbNote = "CHECKING TODAY'S BOARD...";
  loadBoard().then(() => {
    if (id !== runId || S !== 'results') return;
    if (qualifies(score)) {
      entry = { ch: lastInitials.split(''), sel: 0, busy: false, place: placeFor(score) };
      lbNote = ''; S = 'entry';
      tone(523, 0.12, 'triangle', 0.1); tone(659, 0.12, 'triangle', 0.1, 0.1); tone(784, 0.25, 'triangle', 0.1, 0.2);
    } else lbNote = "NOT IN TODAY'S TOP " + LB.size;
  }).catch(() => { if (id === runId) lbNote = 'LEADERBOARD OFFLINE'; });
}

function openBoard(from) {
  boardFrom = from; if (from !== 'run') highlight = 0;
  S = 'board'; boardLock = 0.35;
  loadBoard().catch(() => {});
}

async function submitEntry() {
  if (!entry || entry.busy) return;
  const id = runId; entry.busy = true;
  const initials = entry.ch.join('');
  try {
    lastInitials = initials; try { localStorage.setItem('dropit_initials', initials); } catch (e) {}
    const res = await lbCall('submit_score', { p_initials: initials, p_score: score, p_level: level, p_caught: caught, p_accuracy: accuracyPct() });
    highlight = (res && res[0] && res[0].place) || 0;
  } catch (e) {
    if (/not_top_10/.test(e.message)) highlight = 0;           // someone beat you to it; just show the board
    else { if (entry) entry.busy = false; toast = { msg: 'Could not save. Try again.', life: 2 }; return; }
  }
  try { await loadBoard(); } catch (e) {}
  if (id !== runId) return;
  entry = null; boardFrom = 'run'; S = 'board'; boardLock = 0.6;
  tone(659, 0.12, 'triangle', 0.1); tone(880, 0.25, 'triangle', 0.1, 0.1);
}

function cycleChar(i, dir) {
  const k = CHARS.indexOf(entry.ch[i]);
  entry.ch[i] = CHARS[(k + dir + CHARS.length) % CHARS.length];
  tone(440 + dir * 60, 0.05, 'square', 0.04);
}
function entryKey(e) {
  if (!entry || entry.busy) return;
  const k = e.key || '';
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (k.length === 1 && /[a-z0-9]/i.test(k)) { entry.ch[entry.sel] = k.toUpperCase(); entry.sel = Math.min(2, entry.sel + 1); tone(520, 0.05, 'square', 0.04); }
  else if (k === 'Backspace') entry.sel = Math.max(0, entry.sel - 1);
  else if (k === 'ArrowLeft') entry.sel = Math.max(0, entry.sel - 1);
  else if (k === 'ArrowRight') entry.sel = Math.min(2, entry.sel + 1);
  else if (k === 'ArrowUp') cycleChar(entry.sel, 1);
  else if (k === 'ArrowDown') cycleChar(entry.sel, -1);
  else if (k === 'Enter') submitEntry();
  else return;
  e.preventDefault();
}
const inRect = (p, b) => p && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
function entryPress(pt) {
  if (!entry || entry.busy || !pt) return;
  for (let i = 0; i < 3; i++) {
    const cx = W / 2 + (i - 1) * 84;
    if (inRect(pt, { x: cx - 32, y: 312, w: 64, h: 40 })) { entry.sel = i; cycleChar(i, 1); return; }
    if (inRect(pt, { x: cx - 32, y: 440, w: 64, h: 40 })) { entry.sel = i; cycleChar(i, -1); return; }
    if (inRect(pt, { x: cx - 32, y: 352, w: 64, h: 88 })) { entry.sel = i; return; }
  }
  if (inRect(pt, enterBtn)) submitEntry();
  else if (inRect(pt, skipBtn)) { entry = null; S = 'results'; lbNote = ''; resLock = 0; }
}

function levelClear() {
  hp = Math.min(CFG.hpMax, hp + 1);
  tone(392, 0.15, 'triangle', 0.1); tone(523, 0.15, 'triangle', 0.1, 0.1); tone(659, 0.3, 'triangle', 0.1, 0.2);
  startBanner(level + 1, true);
}

function accuracyPct() { return caught ? Math.round(accSum / caught * 100) : 0; }

function shareText() {
  return `drop_it  |  Level ${level}  |  ${score} pts  |  ${caught} caught  |  ${accuracyPct()}% accuracy`;
}
function doShare() {
  const text = shareText();
  const done = ok => { toast = { msg: ok ? 'Copied to clipboard!' : 'Could not copy', life: 1.6 }; };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
      return;
    }
  } catch (e) {}
  fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta); done(ok);
  } catch (e) { done(false); }
}

/* ============================================================
   UPDATE
   ============================================================ */
function physics(dt) {
  bar.vy += bar.g * dt;
  bar.top += bar.vy * dt;
  if (bar.top + bar.h >= CFG.groundY) {
    bar.top = CFG.groundY - bar.h; bar.vy = 0; bar.landed = true;
    if (S === 'fall') endBarMiss('MISS');
    else shake = Math.max(shake, 3);
  }
}

function updateHang(dt) {
  const b = bar;
  b.pt += dt;
  b.ox = 0; b.oy = 0; b.dip = 0; b.cdip = 0;
  switch (b.phase) {
    case 'enter': {
      const k = Math.min(1, b.pt / CFG.enterTime);
      b.cx = lerp(-60, W / 2, ease(k));
      if (k >= 1) { b.cx = W / 2; b.phase = 'wait'; b.pt = 0; tone(120, 0.08, 'square', 0.06); }
      break;
    }
    case 'wait':
      if (b.pt >= b.wait) { b.phase = 'shake'; b.pt = 0; b.rattle = 0; }
      break;
    case 'shake': {
      // The tell: the clamp rattles harder and harder until it lets go.
      const k = Math.min(1, b.pt / b.tell), amp = lerp(0.6, 3.4, k);
      b.ox = rand(-amp, amp); b.oy = rand(-amp, amp) * 0.6;
      b.rattle -= dt;
      if (b.rattle <= 0) { tone(150 + rand(0, 70), 0.03, 'square', 0.03); b.rattle = 0.06; }
      if (b.pt >= b.tell) {
        if (b.kind === 'decoy') {
          b.phase = 'hitch'; b.pt = 0;
          burst(b.cx, b.top0 + 6, '#ffd166', 10, 220);
          tone(95, 0.12, 'square', 0.1); tone(60, 0.16, 'sawtooth', 0.07, 0.02);   // sounds just like a real release
          buzz(20);
        } else releaseBar();
      }
      break;
    }
    case 'hitch': {
      // The clamp lets go, the bar really falls a little, then the clamp chases it down and re-grabs.
      const p = b.pt, amp = lerp(CFG.dipMin, CFG.dipMax, Math.min(1, (level - 1) / 3));
      const f = q => q <= 0 ? 0 : q < 0.09 ? amp * (1 - Math.pow(1 - q / 0.09, 2)) : q < 0.13 ? amp : q < 0.26 ? amp * (1 - (q - 0.13) / 0.13) : 0;
      b.dip = f(p); b.cdip = f(p - 0.06);
      b.jaw = CFG.barW / 2 + ((b.dip - b.cdip) > 3 ? 14 : 0);
      if (!b.clanked && p >= 0.2) { b.clanked = true; tone(260, 0.05, 'square', 0.07); tone(110, 0.08, 'sawtooth', 0.05, 0.02); }
      if (p >= 0.34) { b.phase = 'hold'; b.pt = 0; b.jaw = CFG.barW / 2; }
      break;
    }
    case 'hold':
      if (b.pt >= 0.45) { b.phase = 'exit'; b.pt = 0; }
      break;
    case 'exit': {
      const k = Math.min(1, b.pt / CFG.exitTime);
      b.cx = W / 2 + easeIn(k) * (W / 2 + 90);
      if (k >= 1) spawn();
      break;
    }
  }
  if (bar && !bar.released) bar.x = bar.cx;
}

function update(dt) {
  // hand pads
  const target = handHold > 0 ? handClosedGap : 66;
  handHold = Math.max(0, handHold - dt);
  handGap += (target - handGap) * Math.min(1, dt * 28);
  hpHit = Math.max(0, hpHit - dt);
  boardLock = Math.max(0, boardLock - dt);

  if (S === 'banner') {
    banner.t += dt;
    if (banner.t >= 2.6) beginLevel();
  } else if (S === 'hang') updateHang(dt);

  if (S === 'fall' && !bar.landed) {
    // sub-step so landing/catch timing is consistent across frame rates
    let left = dt;
    while (left > 0 && S === 'fall') { const s = Math.min(left, 1 / 240); physics(s); left -= s; }
  } else if (S === 'settle') {
    timer += dt;
    if (bar.free && !bar.landed) physics(dt);
    if (timer >= (dead ? 1.4 : 0.8) && (bar.landed || bar.caught)) {
      if (dead) finishRun();
      else {
        idx++;
        if (idx >= CFG.barsPerLevel) levelClear(); else spawn();
      }
    }
  } else if (S === 'results') {
    resLock = Math.max(0, resLock - dt);
  }

  // the empty carriage glides away after a release
  if (bar && bar.released) {
    bar.exitT += dt;
    bar.cx = W / 2 + easeIn(Math.min(1, bar.exitT / 0.6)) * (W / 2 + 90);
  }

  // score count-up
  shownScore += (score - shownScore) * Math.min(1, dt * 14);
  if (Math.abs(score - shownScore) < 0.5) shownScore = score;

  // fx
  for (const p of particles) { p.life -= dt; p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  particles = particles.filter(p => p.life > 0);
  for (const t of texts) { t.life -= dt; t.y -= 26 * dt; }
  texts = texts.filter(t => t.life > 0);
  shake = Math.max(0, shake - dt * 30);
  flash = Math.max(0, flash - dt * 1.4);
  if (toast) { toast.life -= dt; if (toast.life <= 0) toast = null; }
}

/* ============================================================
   DRAW
   ============================================================ */
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
function text(str, x, y, size, color, align = 'center', weight = 700, alpha = 1) {
  ctx.globalAlpha = alpha;
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.fillText(str, x, y);
  ctx.globalAlpha = 1;
}

function drawRail() {
  const y = CFG.railY;
  const g = ctx.createLinearGradient(0, y - 8, 0, y + 8);
  g.addColorStop(0, '#59638f'); g.addColorStop(0.5, '#3a426b'); g.addColorStop(1, '#232a4d');
  ctx.fillStyle = g; ctx.fillRect(-20, y - 8, W + 40, 16);
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(-20, y - 8, W + 40, 2);
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  for (let x = 14; x < W; x += 42) { ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 7); ctx.fill(); }
}

// Carriage + arm + crossbar (behind the item). Jaws are drawn over it.
function drawClamp(b, front) {
  const jitterX = b.released ? 0 : b.ox, jitterY = b.released ? 0 : b.oy;
  const cx = b.cx + jitterX, crossY = b.top0 - 10 + jitterY + b.cdip;
  if (!front) {
    ctx.fillStyle = '#1a2040';
    ctx.beginPath(); ctx.arc(cx - 15, CFG.railY, 7, 0, 7); ctx.arc(cx + 15, CFG.railY, 7, 0, 7); ctx.fill();
    ctx.fillStyle = '#6a77c0';
    ctx.beginPath(); ctx.arc(cx - 15, CFG.railY, 3, 0, 7); ctx.arc(cx + 15, CFG.railY, 3, 0, 7); ctx.fill();
    const cg = ctx.createLinearGradient(0, CFG.railY + 4, 0, CFG.railY + 30);
    cg.addColorStop(0, '#6370b8'); cg.addColorStop(1, '#343c75');
    ctx.fillStyle = cg; rr(cx - 26, CFG.railY + 4, 52, 28, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1.5; rr(cx - 26, CFG.railY + 4, 52, 28, 7); ctx.stroke();
    ctx.fillStyle = '#8590d8'; ctx.fillRect(cx - 4, CFG.railY + 30, 8, Math.max(0, crossY - (CFG.railY + 30)));
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(cx + 1, CFG.railY + 30, 3, Math.max(0, crossY - (CFG.railY + 30)));
    ctx.fillStyle = '#9aa6f0'; rr(cx - 30, crossY - 4, 60, 10, 4); ctx.fill();
  } else {
    const jy = b.top0 - 4 + jitterY + b.cdip;
    ctx.fillStyle = '#c3cbff';
    rr(cx - b.jaw - 9, jy, 9, 28, 3); ctx.fill();
    rr(cx + b.jaw, jy, 9, 28, 3); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    rr(cx - b.jaw - 9, jy + 20, 9, 8, 3); ctx.fill();
    rr(cx + b.jaw, jy + 20, 9, 8, 3); ctx.fill();
  }
}

function drawBar(b) {
  if (b.hidden) return;
  const w = CFG.barW, h = b.h;
  const x = b.x + (b.released ? 0 : b.ox) - w / 2;
  const y = b.top + (b.released ? 0 : b.oy) + b.dip;
  const ty = y + (0.5 + b.off * 0.5) * h, half = h / 2;

  ctx.save();
  rr(x, y, w, h, 8); ctx.clip();
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, '#f0a030'); g.addColorStop(0.5, '#ffe08a'); g.addColorStop(1, '#e08a20');
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  // scoring zones around the target, wide to narrow
  const zones = [[0.75, 'rgba(110,184,255,.35)'], [0.45, 'rgba(94,242,194,.55)'], [0.20, 'rgba(255,255,255,.9)']];
  for (const [f, col] of zones) { ctx.fillStyle = col; ctx.fillRect(x, ty - half * f, w, half * f * 2); }
  // ruler ticks
  ctx.strokeStyle = 'rgba(60,35,0,.45)'; ctx.lineWidth = 1.5;
  for (let k = 1; k < 10; k++) {
    const tk = y + (h * k) / 10, len = k % 5 === 0 ? 10 : 6;
    ctx.beginPath(); ctx.moveTo(x, tk); ctx.lineTo(x + len, tk); ctx.moveTo(x + w, tk); ctx.lineTo(x + w - len, tk); ctx.stroke();
  }
  // spike sections: red wash
  for (const s of b.segs) if (s.type === 'spike') {
    ctx.fillStyle = 'rgba(210,30,55,.6)'; ctx.fillRect(x, y + s.a * h, w, (s.b - s.a) * h);
    ctx.strokeStyle = 'rgba(80,0,10,.5)'; ctx.lineWidth = 2;
    for (let k = y + s.a * h - w; k < y + s.b * h; k += 8) { ctx.beginPath(); ctx.moveTo(x, k + w); ctx.lineTo(x + w, k); ctx.stroke(); }
  }
  // bomb sections: dark with a pulsing red glow
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 110);
  for (const s of b.segs) if (s.type === 'bomb') {
    ctx.fillStyle = '#12131c'; ctx.fillRect(x, y + s.a * h, w, (s.b - s.a) * h);
    ctx.fillStyle = `rgba(255,70,50,${0.18 + 0.3 * pulse})`; ctx.fillRect(x, y + s.a * h, w, (s.b - s.a) * h);
    ctx.fillStyle = '#ff4d5a'; ctx.fillRect(x, y + s.a * h, w, 3); ctx.fillRect(x, y + s.b * h - 3, w, 3);
  }
  // target line
  ctx.strokeStyle = '#2a1b00'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, ty); ctx.lineTo(x + w, ty); ctx.stroke();
  ctx.restore();

  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2; rr(x, y, w, h, 8); ctx.stroke();

  // bomb icon planted in the bar, with a flickering fuse
  for (const s of b.segs) if (s.type === 'bomb') {
    const cy2 = y + ((s.a + s.b) / 2) * h, r = 13;
    const bg = ctx.createRadialGradient(x + w / 2 - 4, cy2 - 4, 2, x + w / 2, cy2, r);
    bg.addColorStop(0, '#767b94'); bg.addColorStop(0.55, '#2a2d3f'); bg.addColorStop(1, '#07080e');
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(x + w / 2, cy2, r, 0, 7); ctx.fill();
    ctx.strokeStyle = '#c9a56a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x + w / 2 + 5, cy2 - r + 2); ctx.quadraticCurveTo(x + w / 2 + 12, cy2 - r - 6, x + w / 2 + 7, cy2 - r - 11); ctx.stroke();
    const fl = 0.6 + 0.4 * Math.sin(performance.now() / 50);
    ctx.fillStyle = `rgb(255,${Math.round(180 + 60 * fl)},60)`;
    ctx.beginPath(); ctx.arc(x + w / 2 + 7, cy2 - r - 11, 3 + 2 * fl, 0, 7); ctx.fill();
  }
  // spikes poking out both sides
  ctx.fillStyle = '#ff4d5a';
  for (const s of b.segs) if (s.type === 'spike') {
    const n = Math.max(2, Math.round((s.b - s.a) * h / 9)), step = ((s.b - s.a) * h) / n;
    for (let k = 0; k < n; k++) {
      const sy = y + s.a * h + k * step;
      ctx.beginPath(); ctx.moveTo(x, sy + 1); ctx.lineTo(x - 9, sy + step / 2); ctx.lineTo(x, sy + step - 1); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + w, sy + 1); ctx.lineTo(x + w + 9, sy + step / 2); ctx.lineTo(x + w, sy + step - 1); ctx.fill();
    }
  }
  // target markers
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#2a1b00'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x - 13, ty - 7); ctx.lineTo(x - 13, ty + 7); ctx.lineTo(x - 3, ty); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + w + 13, ty - 7); ctx.lineTo(x + w + 13, ty + 7); ctx.lineTo(x + w + 3, ty); ctx.closePath(); ctx.fill(); ctx.stroke();
}

function drawHand() {
  const y = CFG.handY, cx = W / 2;
  const lit = handHold > 0 && bar && bar.caught && bar.tier >= 0 ? CFG.tiers[bar.tier].color : '#9fb0ff';
  ctx.fillStyle = '#242c57';
  rr(-20, y - 13, cx - handGap + 20 - 24, 26, 13); ctx.fill();
  rr(cx + handGap + 24, y - 13, W - (cx + handGap + 24) + 20, 26, 13); ctx.fill();
  ctx.fillStyle = lit;
  rr(cx - handGap - 28, y - 16, 28, 32, 10); ctx.fill();
  rr(cx + handGap, y - 16, 28, 32, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(159,176,255,.16)'; ctx.setLineDash([6, 8]); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cx - handGap - 30, y); ctx.moveTo(cx + handGap + 30, y); ctx.lineTo(W, y); ctx.stroke();
  ctx.setLineDash([]);
}

function drawScene() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0b1020'); bg.addColorStop(1, '#1b2150');
  ctx.fillStyle = bg; ctx.fillRect(-20, -20, W + 40, H + 40);
  const pg = ctx.createLinearGradient(0, CFG.groundY, 0, H);
  pg.addColorStop(0, '#39427a'); pg.addColorStop(1, '#171c40');
  ctx.fillStyle = pg; ctx.fillRect(-20, CFG.groundY, W + 40, H - CFG.groundY + 20);
  ctx.fillStyle = '#7f8cff'; ctx.fillRect(-20, CFG.groundY, W + 40, 3);
  drawRail();
  drawHand();
  if (bar) { drawClamp(bar, false); drawBar(bar); drawClamp(bar, true); }
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const t of texts) text(t.text, t.x, t.y, t.size, t.color, 'center', 800, Math.min(1, (t.life / t.max) * 1.6));
}

// Little clamp icons for health.
function drawHp(x, y, n, size, flashIdx) {
  for (let i = 0; i < CFG.hpMax; i++) {
    const px = x + i * (size + 8), alive = i < n;
    const hit = i === flashIdx && hpHit > 0;
    ctx.fillStyle = hit ? '#ff4d5a' : alive ? '#9fb0ff' : 'rgba(255,255,255,.1)';
    rr(px, y, size, size, 5); ctx.fill();
    if (alive || hit) {
      ctx.fillStyle = '#1a2040';
      rr(px + size * 0.3, y + size * 0.2, size * 0.4, size * 0.6, 2); ctx.fill();
      ctx.fillStyle = hit ? '#ff4d5a' : '#9fb0ff';
      ctx.fillRect(px + size * 0.42, y + size * 0.25, size * 0.16, size * 0.3);
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(px + 5, y + 5); ctx.lineTo(px + size - 5, y + size - 5); ctx.moveTo(px + size - 5, y + 5); ctx.lineTo(px + 5, y + size - 5); ctx.stroke();
    }
  }
}

function drawHUD() {
  const n = CFG.barsPerLevel, gap = (W - 48) / n;
  for (let i = 0; i < n; i++) {
    const x = 24 + gap * (i + 0.5);
    let col = 'rgba(255,255,255,.18)';
    if (i < log.length) col = log[i] === -1 ? '#ff6b6b' : log[i] === -2 ? '#ff9f43' : CFG.tiers[log[i]].color;
    else if (i === idx && (S === 'hang' || S === 'fall')) col = '#fff';
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, 20, 6, 0, 7); ctx.fill();
  }
  text(String(Math.round(shownScore)), 24, 60, 40, '#fff', 'left', 800);
  text('LEVEL ' + level, W / 2, 56, 15, '#8d97d6', 'center', 800);
  drawHp(24, 84, hp, 16, hp);   // the slot that was just lost flashes
  if (streak >= 2) {
    const mult = 1 + CFG.comboStep * (streak - 1);
    text('x' + mult.toFixed(1), W - 24, 56, 28, '#ffe066', 'right', 800);
    text('COMBO', W - 24, 78, 11, '#8d97d6', 'right', 700);
  }
}

function overlayDim(a) { ctx.fillStyle = `rgba(6,9,22,${a})`; ctx.fillRect(-20, -20, W + 40, H + 40); }

function drawBanner() {
  overlayDim(0.78);
  const k = Math.min(1, banner.t / 0.25);
  text(banner.cleared ? 'LEVEL CLEAR' : 'GET READY', W / 2, 200, 16, banner.cleared ? '#5ef2c2' : '#8d97d6', 'center', 800);
  text('LEVEL ' + banner.lv, W / 2, 262, 60, '#fff', 'center', 800, k);
  const info = LEVEL_INFO[Math.min(banner.lv, 6)];
  text(info[0], W / 2, 342, 22, '#ffe066', 'center', 800);
  text(info[1], W / 2, 374, 15, '#aab4ee', 'center', 500);
  text(`Catch ${CFG.passMin} of ${CFG.barsPerLevel} to advance`, W / 2, 430, 15, '#8d97d6', 'center', 500);
  if (banner.cleared) text('+1 CLAMP', W / 2, 482, 18, '#5ef2c2', 'center', 800);
  const iw = CFG.hpMax * 28 - 8;
  drawHp(W / 2 - iw / 2, 505, hp, 20, -1);
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 350);
  text('TAP TO SKIP', W / 2, 640, 14, '#8d97d6', 'center', 700, banner.t > 0.5 ? 0.4 + 0.5 * pulse : 0);
}

function drawTitle() {
  overlayDim(0.72);
  text('drop_it', W / 2, 250, 64, '#fff', 'center', 800);
  text('catch the bar. hit the glow.', W / 2, 298, 16, '#aab4ee', 'center', 500);
  const lines = ['Wait for the clamp to let go, then tap.', `Catch ${CFG.passMin} of ${CFG.barsPerLevel} bars to clear a level.`, 'Watch for fake-outs. Never catch a bomb.', `Daily deck: same bars for everyone, shuffled every run.`];
  lines.forEach((l, i) => text(l, W / 2, 350 + i * 26, 15, '#8d97d6', 'center', 500));
  const pulse = 0.65 + 0.35 * Math.sin(performance.now() / 350);
  text('TAP TO START', W / 2, 610, 26, '#ffe066', 'center', 800, pulse);
  if (best) text(`BEST ${best}  -  LEVEL ${bestLevel}`, W / 2, 652, 15, '#8d97d6', 'center', 700);
  button(titleBoardBtn, "TODAY'S TOP 10", 14);
}

function button(b, label, size = 15) {
  ctx.fillStyle = '#2a3270'; rr(b.x, b.y, b.w, b.h, 14); ctx.fill();
  ctx.strokeStyle = '#7f8cff'; ctx.lineWidth = 2; rr(b.x, b.y, b.w, b.h, 14); ctx.stroke();
  text(label, b.x + b.w / 2, b.y + b.h / 2, size, '#fff', 'center', 800);
}

function drawResults() {
  overlayDim(0.72);
  ctx.fillStyle = '#141a3d'; rr(30, 100, W - 60, 540, 22); ctx.fill();
  ctx.strokeStyle = 'rgba(159,176,255,.25)'; ctx.lineWidth = 2; rr(30, 100, W - 60, 540, 22); ctx.stroke();
  text('GAME OVER', W / 2, 138, 14, '#8d97d6', 'center', 700);
  text(dead || '', W / 2, 166, 20, '#ff6b6b', 'center', 800);
  text(String(Math.round(shownScore)), W / 2, 232, 80, '#fff', 'center', 800);
  text(newBest ? 'NEW BEST!' : 'BEST ' + best, W / 2, 288, 16, newBest ? '#ffe066' : '#8d97d6', 'center', 800);
  const cols = [['LEVEL', String(level)], ['CAUGHT', String(caught)], ['ACCURACY', accuracyPct() + '%'], ['STREAK', String(maxStreak)]];
  cols.forEach(([k, v], i) => {
    const x = 30 + (W - 60) * (i + 0.5) / 4;
    text(v, x, 346, 28, '#fff', 'center', 800);
    text(k, x, 376, 10, '#8d97d6', 'center', 700);
  });
  CFG.tiers.forEach((t, i) => {
    const x = 30 + (W - 60) * (i + 0.5) / 4;
    ctx.fillStyle = t.color; ctx.beginPath(); ctx.arc(x, 425, 6, 0, 7); ctx.fill();
    text(String(tierCounts[i]), x, 452, 22, '#fff', 'center', 800);
    text(t.name, x, 477, 10, '#8d97d6', 'center', 700);
  });
  if (fakes) text(`Faked out ${fakes} time${fakes === 1 ? '' : 's'}`, W / 2, 504, 12, '#ff9f43', 'center', 700);
  button(shareBtn, 'COPY RESULT', 14);
  button(boardBtn, "TODAY'S TOP 10", 14);
  const pulse = resLock > 0 ? 0.25 : 0.65 + 0.35 * Math.sin(performance.now() / 350);
  text('TAP ANYWHERE TO PLAY AGAIN', W / 2, 604, 16, '#ffe066', 'center', 800, pulse);
  if (lbNote) text(lbNote, W / 2, 628, 11, '#8d97d6', 'center', 700);
}

function drawEntry() {
  overlayDim(0.97);
  const blink = 0.7 + 0.3 * Math.sin(performance.now() / 160);
  text('TOP 10 TODAY!', W / 2, 108, 36, '#ffe066', 'center', 800, blink);
  text('#' + entry.place + ' SO FAR', W / 2, 150, 18, '#5ef2c2', 'center', 800);
  text(String(score), W / 2, 228, 72, '#fff', 'center', 800);
  text('ENTER YOUR INITIALS', W / 2, 296, 14, '#8d97d6', 'center', 700);
  for (let i = 0; i < 3; i++) {
    const cx = W / 2 + (i - 1) * 84, on = i === entry.sel;
    ctx.fillStyle = '#141a3d'; rr(cx - 32, 352, 64, 88, 12); ctx.fill();
    ctx.strokeStyle = on ? '#ffe066' : 'rgba(159,176,255,.3)'; ctx.lineWidth = 3; rr(cx - 32, 352, 64, 88, 12); ctx.stroke();
    text(entry.ch[i], cx, 398, 58, on ? '#ffe066' : '#fff', 'center', 800);
    ctx.fillStyle = '#9fb0ff';
    ctx.beginPath(); ctx.moveTo(cx - 13, 340); ctx.lineTo(cx + 13, 340); ctx.lineTo(cx, 322); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx - 13, 452); ctx.lineTo(cx + 13, 452); ctx.lineTo(cx, 470); ctx.closePath(); ctx.fill();
  }
  button(enterBtn, entry.busy ? 'SAVING...' : 'ENTER', 22);
  text('SKIP', W / 2, 592, 14, '#8d97d6', 'center', 700);
  text('tap the arrows, or just type', W / 2, 660, 12, '#6671b5', 'center', 500);
}

function drawBoard() {
  overlayDim(0.97);
  text("TODAY'S TOP 10", W / 2, 80, 32, '#ffe066', 'center', 800);
  text(board.day || todayLabel(), W / 2, 114, 14, '#aab4ee', 'center', 700);
  text('RESETS AT MIDNIGHT, ARIZONA TIME', W / 2, 134, 10, '#6671b5', 'center', 700);
  if (board.status !== 'ok') {
    text(board.status === 'loading' ? 'LOADING...' : 'LEADERBOARD OFFLINE', W / 2, 350, 22, '#8d97d6', 'center', 800);
    if (board.status === 'error') text('Scores need an internet connection.', W / 2, 384, 13, '#6671b5', 'center', 500);
  } else {
    for (let i = 0; i < LB.size; i++) {
      const row = board.rows[i], y = 176 + i * 38, mine = row && highlight && row.place === highlight;
      if (mine) { ctx.fillStyle = `rgba(255,224,102,${0.14 + 0.1 * Math.sin(performance.now() / 160)})`; rr(34, y - 17, W - 68, 34, 8); ctx.fill(); }
      const col = mine ? '#ffe066' : row ? '#fff' : '#3a4380';
      text(String(i + 1), 64, y, 18, i < 3 && row ? ['#ffe066', '#c3c9dd', '#e8a468'][i] : '#8d97d6', 'center', 800);
      text(row ? row.initials : '---', 104, y, 26, col, 'left', 800);
      if (row) text('L' + row.level, 250, y, 13, '#8d97d6', 'right', 700);
      text(row ? String(row.score) : '0', W - 54, y, 22, col, 'right', 800);
    }
    if (!board.rows.length) text('No scores yet today. Be the first!', W / 2, 580, 14, '#8d97d6', 'center', 600);
  }
  if (boardFrom === 'run') button(copyBtn, 'COPY MY RESULT', 14);
  const pulse = boardLock > 0 ? 0.25 : 0.65 + 0.35 * Math.sin(performance.now() / 350);
  text(boardFrom === 'run' ? 'TAP ANYWHERE TO PLAY AGAIN' : 'TAP ANYWHERE TO GO BACK', W / 2, 692, 15, '#ffe066', 'center', 800, pulse);
}

function draw() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  drawScene();
  ctx.restore();
  if (flash > 0) { ctx.globalAlpha = flash; ctx.fillStyle = flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (S === 'title') drawTitle();
  else if (S === 'entry') drawEntry();
  else if (S === 'board') drawBoard();
  else {
    drawHUD();
    if (S === 'banner') drawBanner();
    if (S === 'results') drawResults();
  }
  if (toast) text(toast.msg, W / 2, 692, 15, '#5ef2c2', 'center', 800, Math.min(1, toast.life * 2));
}

/* ============================================================
   LOOP + INPUT
   ============================================================ */
function frame(now) {
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
}

function press(e, pt) {
  audio();
  if (S === 'title') { if (inRect(pt, titleBoardBtn)) openBoard('title'); else startRun(); return; }
  if (S === 'banner') { if (banner.t > 0.5) beginLevel(); return; }
  if (S === 'entry') { entryPress(pt); return; }
  if (S === 'board') {
    if (boardFrom === 'run' && inRect(pt, copyBtn)) { doShare(); return; }
    if (boardLock > 0) return;
    if (boardFrom === 'run') startRun();
    else if (boardFrom === 'results') { S = 'results'; resLock = 0; }
    else S = 'title';
    return;
  }
  if (S === 'results') {
    if (inRect(pt, shareBtn)) { doShare(); return; }
    if (inRect(pt, boardBtn)) { openBoard('results'); return; }
    if (resLock <= 0) startRun();
    return;
  }
  tap(e.timeStamp);
}

cv.addEventListener('pointerdown', e => { e.preventDefault(); press(e, toLogical(e)); });
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (S === 'entry') { entryKey(e); return; }
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowDown') { e.preventDefault(); press(e, null); }
});
document.addEventListener('contextmenu', e => e.preventDefault());

// Title screen shows a clamped bar as a backdrop.
newBar(0, 'bar'); bar.phase = 'wait'; bar.cx = bar.x = W / 2;

// Small debug/test surface (harmless in production).
window.__drop = {
  cfg: CFG, dbg,
  tap: () => tap(performance.now()),
  start: startRun,
  skipBanner: () => { if (S === 'banner') beginLevel(); },
  endRun: (sc, why) => { score = shownScore = sc; caught = 3; dead = why || 'LEVEL FAILED'; finishRun(); },
  lb: () => ({ S, board, entry, lbNote, highlight, boardFrom }),
  buildCards, buildPlan, dayKey,
  goto: lv => { startRun(); banner.lv = lv; beginLevel(); },
  state: () => ({ S, level, idx, hp, dead, lost, score, caught, fakes, streak, maxStreak, accuracy: accuracyPct(), best, log: log.slice(),
    bar: bar && { kind: bar.kind, top: bar.top, h: bar.h, vy: bar.vy, g: bar.g, off: bar.off, segs: bar.segs, phase: bar.phase, pt: bar.pt, tell: bar.tell, wait: bar.wait },
    handY: CFG.handY }),
};

requestAnimationFrame(t => { lastFrame = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
